# 飞牛 NAS 等已占用 80/443：host 网络 + 高位默认反代端口（18080/9443）
# 拉取镜像：docker compose up -d
# 本地构建：docker compose up -d --build
services:
  fonu:
    build: .
    image: muxui/fonu:latest
    container_name: fonu
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    network_mode: host
    volumes:
      - fonu-data:/data
    environment:
      FONU_DATA_DIR: /data
      FONU_LISTEN: ${FONU_LISTEN:-:6893}
      FONU_TLS_CERT_FILE: ${FONU_TLS_CERT_FILE:-}
      FONU_TLS_KEY_FILE: ${FONU_TLS_KEY_FILE:-}
      # To enable HTTPS, mount a certificate directory read-only under volumes,
      # e.g. ./console-tls:/console-tls:ro, and set both TLS file paths.
      FONU_SESSION_SECRET: ${FONU_SESSION_SECRET:-}
      FONU_NGINX_HTTP_PORT: ${FONU_NGINX_HTTP_PORT:-18080}
      FONU_NGINX_HTTPS_PORT: ${FONU_NGINX_HTTPS_PORT:-9443}

volumes:
  fonu-data:
