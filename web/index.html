<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Fonu</title>
    <script>
      (function () {
        var mode = 'system';
        try { mode = localStorage.getItem('fonu-theme') || 'system'; } catch (_) {}
        var dark = mode === 'dark' || (mode !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        var accent = 'brand';
        try { accent = localStorage.getItem('fonu-accent') || 'brand'; } catch (_) {}
        var colors = { brand: ['#087eaa','#55c9ef'], ice: ['#3869c9','#8cb4ff'], teal: ['#128579','#5cc7b7'], forest: ['#237d60','#77c6a5'], blue: ['#2563eb','#82aaff'], purple: ['#7549be','#b49af5'], orange: ['#a95218','#ecad72'], graphite: ['#626971','#b5bcc5'] };
        document.documentElement.style.setProperty('--boot-brand', (Object.prototype.hasOwnProperty.call(colors, accent) ? colors[accent] : colors.brand)[dark ? 1 : 0]);
      })();
    </script>
    <style>
      html { background:#f5f6f8; color:#555e6b; }
      html[data-theme="dark"] { background:#171a1f; color:#b4bdca; }
      body { margin:0; }
      #fonu-boot { min-height:100vh; display:grid; place-content:center; justify-items:center; gap:16px; font:14px system-ui,sans-serif; text-align:center; }
      #fonu-boot button { font:inherit; color:inherit; background:transparent; border:1px solid currentColor; border-radius:8px; padding:8px 16px; cursor:pointer; }
      .boot-spinner { width:32px;height:32px;border:3px solid currentColor;border-color:transparent transparent color-mix(in srgb, var(--boot-brand, #3869c9) 25%, transparent) color-mix(in srgb, var(--boot-brand, #3869c9) 25%, transparent);border-top-color:var(--boot-brand, #3869c9);border-radius:50%;animation:boot-spin .8s linear infinite; }
      @keyframes boot-spin { to { transform:rotate(360deg); } }
      @media(prefers-reduced-motion:reduce) { .boot-spinner { animation:none; } }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="fonu-boot" role="status"><div class="boot-spinner" aria-hidden="true"></div><span id="fonu-boot-text">正在加载 Fonu…</span><button id="fonu-boot-retry" hidden>重新加载</button></div>
      <script>
        (function () {
          var showError = function () {
            var text = document.getElementById('fonu-boot-text');
            var retry = document.getElementById('fonu-boot-retry');
            if (text && retry) { text.textContent = '加载时间较长，请检查 Fonu 服务或重新加载。'; retry.hidden = false; }
          };
          document.getElementById('fonu-boot-retry').onclick = function () { location.reload(); };
          window.addEventListener('vite:preloadError', showError);
          window.addEventListener('error', function(e) { if(e.target && e.target.tagName === 'SCRIPT') showError(); }, true);
          setTimeout(showError, 8000);
        })();
      </script>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
