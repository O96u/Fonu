name: 功能建议
description: 新功能或改进想法（非 Bug）
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: input
    id: version
    attributes:
      label: 当前使用的版本（可选）
      placeholder: "例如 1.3.3"

  - type: textarea
    id: description
    attributes:
      label: 建议内容
      description: 你希望 Fonu 做什么、解决什么场景
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 背景（可选）
      description: 使用场景、参考产品、是否愿意参与测试等
