name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Validate FPK lifecycle shell scripts
        run: |
          bash -n packaging/fonu-fpk/scripts/build-fpk.sh
          for f in packaging/fonu-fpk/cmd/*; do bash -n "$f"; done
      - run: npm ci
        working-directory: web
      - name: Test FPK lifecycle callbacks
        run: bash packaging/fonu-fpk/scripts/test-lifecycle.sh
      - name: Audit npm dependency vulnerabilities
        working-directory: web
        run: npm audit --audit-level=high
      - run: npm run build
        working-directory: web
      - run: mkdir -p cmd/fonu/web/dist && cp -a web/dist/. cmd/fonu/web/dist/
      - run: go vet ./...
      - run: go test ./...
      - name: Benchmark analytics rollups (100k events)
        run: go test ./internal/analytics -run '^$' -bench '^BenchmarkSeriesRawVsRollup$' -benchtime=3x -benchmem
      - run: go test -race ./internal/auth ./internal/nginx ./internal/secret ./internal/scheduler ./internal/api ./internal/backup ./internal/acme ./internal/ddns
