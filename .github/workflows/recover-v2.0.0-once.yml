name: Recover v2.0.0 publication (one-time)
on:
  push:
    branches: [v2]
    paths:
      - '.github/workflows/recover-v2.0.0-once.yml'
permissions:
  contents: write
  actions: read
concurrency:
  group: release-v2.0.0
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      RUN_ID: '45811302007'
      SOURCE_SHA: '6d6b9fa4362b52851067de79e7eb8384fb8c3e88'
      TAG: v2.0.0
      VERSION: '2.0.0'
    steps:
      - name: Verify original build provenance and successful required jobs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          gh api "repos/$repo/actions/runs/$RUN_ID" > run.json
          jq -e --arg sha "$SOURCE_SHA" '.head_sha == $sha and .head_branch == "v2" and .path == ".github/workflows/release.yml" and .event == "workflow_dispatch" and .status == "completed"' run.json
          gh api "repos/$repo/actions/runs/$RUN_ID/jobs?per_page=100" > jobs.json
          for name in setup test security 'fpk (amd64, ubuntu-24.04)' 'fpk (arm64, ubuntu-24.04-arm)' 'docker (linux/amd64, amd64)' 'docker (linux/arm64, arm64)' docker-manifest; do
            jq -e --arg name "$name" '.jobs | any(.name == $name and .conclusion == "success")' jobs.json
          done
          gh run download "$RUN_ID" -R "$repo" --pattern 'fonu-fpk-*' --dir packages
          mkdir assets
          for arch in amd64 arm64; do
            for suffix in "" _root; do
              name="fonu_${VERSION}_${arch}${suffix}.fpk"
              test -s "packages/fonu-fpk-$arch/$name"
              cp "packages/fonu-fpk-$arch/$name" assets/
            done
          done
          (cd assets && sha256sum *.fpk > SHA256SUMS.txt)
          gh api "repos/$repo/contents/docs/releases/$TAG.md?ref=$SOURCE_SHA" --jq .content | base64 -d > release-notes.md
          printf '\nSource commit: %s\nVerified build: https://github.com/%s/actions/runs/%s\n' "$SOURCE_SHA" "$repo" "$RUN_ID" >> release-notes.md
      - name: Publish original verified packages
        env:
          GH_TOKEN: ${{ secrets.V2_RELEASE_TOKEN || github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          if gh release view "$TAG" -R "$repo" >/dev/null 2>&1; then
            echo "::error::Release already exists; refusing to overwrite"
            exit 1
          fi
          if ! gh api "repos/$repo/git/ref/tags/$TAG" > tag.json 2>/dev/null; then
            gh api --method POST "repos/$repo/git/refs" -f ref="refs/tags/$TAG" -f sha="$SOURCE_SHA" > tag.json
          fi
          jq -e --arg sha "$SOURCE_SHA" '.object.type == "commit" and .object.sha == $sha' tag.json >/dev/null
          gh release create "$TAG" assets/* -R "$repo" --verify-tag --latest --title "Fonu $VERSION" --notes-file release-notes.md
          gh release view "$TAG" -R "$repo" --json isDraft,isPrerelease,assets --jq '(.isDraft|not) and (.isPrerelease|not) and (.assets|length == 5)' | grep -qx true
          test "$(gh api "repos/$repo/releases/latest" --jq .tag_name)" = "$TAG"
