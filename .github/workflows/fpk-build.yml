name: Build FPK

# 打 FPK 并上传到独立预发布 Release（不占用正式 v* 的 Latest）。
on:
  workflow_dispatch:
    inputs:
      ref:
        description: '要构建的 Git 引用（分支 / tag / commit）'
        required: true
        default: main
      version:
        description: '安装包版本号（不含 v），如 1.1.10'
        required: true
      release_tag:
        description: 'FPK Release tag（默认 fpk-v + version，勿用正式发版 v* tag）'
        required: false

concurrency:
  group: fpk-build-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ inputs.version }}
      RELEASE_TAG: ${{ inputs.release_tag != '' && inputs.release_tag || format('fpk-v{0}', inputs.version) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install fnpack
        env:
          FNPACK_DOWNLOAD_URL: ${{ secrets.FNPACK_DOWNLOAD_URL }}
        run: |
          set -euo pipefail
          URL="${FNPACK_DOWNLOAD_URL:-https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64}"
          curl -fsSL -o /usr/local/bin/fnpack "${URL}"
          chmod +x /usr/local/bin/fnpack

      - name: Build FPK (amd64 + arm64)
        run: |
          if ! command -v readelf >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y binutils
          fi
          chmod +x packaging/fonu-fpk/scripts/build-fpk.sh packaging/fonu-fpk/cmd/*
          packaging/fonu-fpk/scripts/build-fpk.sh amd64 "${VERSION}"
          packaging/fonu-fpk/scripts/build-fpk.sh arm64 "${VERSION}"
          ls -la packaging/dist/

      - name: Publish to GitHub Release (prerelease, not Latest)
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [[ "${RELEASE_TAG}" =~ ^v[0-9] ]]; then
            echo "Refusing to publish FPK on formal release tag ${RELEASE_TAG}; use fpk-v<version> or set release_tag explicitly." >&2
            exit 1
          fi
          cd packaging/dist
          cat > release-notes.md <<EOF
          Fonu fnOS 原生安装包（预发布，由 [Build FPK](${RUN_URL}) 构建）

          | 文件 | 架构 |
          |------|------|
          | fonu_${VERSION}_amd64.fpk | x86 (Intel/AMD) |
          | fonu_${VERSION}_arm64.fpk | ARM64 |

          请在本页 **Assets** 中直接下载 \`.fpk\` 文件。正式发版 Latest 仍以 \`v*\` tag 的 Release 为准。
          EOF
          if ! gh release view "${RELEASE_TAG}" -R "${GH_REPO}" >/dev/null 2>&1; then
            gh release create "${RELEASE_TAG}" -R "${GH_REPO}" \
              --title "Fonu FPK ${VERSION}" \
              --prerelease \
              --latest=false \
              --notes-file release-notes.md
          else
            gh release edit "${RELEASE_TAG}" -R "${GH_REPO}" \
              --prerelease \
              --latest=false \
              --notes-file release-notes.md
          fi
          gh release upload "${RELEASE_TAG}" -R "${GH_REPO}" fonu_${VERSION}_amd64.fpk fonu_${VERSION}_arm64.fpk --clobber
