name: Build FPK

# 仅打 FPK。产物上传到 GitHub Release「fpk-preview」（.fpk 直链下载，非 Actions zip）。
on:
  workflow_dispatch:
    inputs:
      ref:
        description: '要构建的 Git 引用（分支 / tag / commit）'
        required: true
        default: main
      version:
        description: '安装包版本号（不含 v），如 1.1.10'
        required: true
      preview_tag:
        description: '预发布 Release 的 tag（存放可直链下载的 .fpk）'
        required: true
        default: fpk-preview
      also_upload_version_release:
        description: '同时上传到已存在的版本 Release（tag 默认 v + version）'
        type: boolean
        default: false
      release_tag:
        description: '版本 Release 的 tag（默认 v + version）'
        required: false

concurrency:
  group: fpk-build-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build-fpk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install fnpack
        env:
          FNPACK_DOWNLOAD_URL: ${{ secrets.FNPACK_DOWNLOAD_URL }}
        run: |
          set -euo pipefail
          URL="${FNPACK_DOWNLOAD_URL:-https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64}"
          echo "Downloading fnpack from ${URL}"
          curl -fsSL -o /usr/local/bin/fnpack "${URL}"
          chmod +x /usr/local/bin/fnpack
          fnpack --help >/dev/null || true

      - name: Build FPK
        run: |
          chmod +x packaging/fonu-fpk/scripts/build-fpk.sh packaging/fonu-fpk/cmd/*
          packaging/fonu-fpk/scripts/build-fpk.sh "${{ matrix.arch }}" "${{ inputs.version }}"

      - name: Stage FPK for publish job
        uses: actions/upload-artifact@v4
        with:
          name: fonu-${{ inputs.version }}-${{ matrix.arch }}
          path: packaging/dist/fonu_${{ inputs.version }}_${{ matrix.arch }}.fpk
          if-no-files-found: error
          compression-level: 0

  publish-fpk:
    needs: build-fpk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download built FPK files
        uses: actions/download-artifact@v4
        with:
          pattern: fonu-${{ inputs.version }}-*
          path: dist
          merge-multiple: true

      - name: List packages
        run: ls -la dist/

      - name: Publish to preview release (direct .fpk download)
        env:
          PREVIEW_TAG: ${{ inputs.preview_tag }}
          VERSION: ${{ inputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          NOTES="Build FPK workflow run ${RUN_URL}

          | 文件 | 架构 |
          |------|------|
          | fonu_${VERSION}_amd64.fpk | x86 (Intel/AMD) |
          | fonu_${VERSION}_arm64.fpk | ARM64 |

          在 Release 资源区直接下载 **.fpk**（不要用 Actions Artifacts 的 zip）。"
          if ! gh release view "${PREVIEW_TAG}" >/dev/null 2>&1; then
            gh release create "${PREVIEW_TAG}" --prerelease --title "FPK preview" --notes "${NOTES}"
          else
            gh release edit "${PREVIEW_TAG}" --prerelease --notes "${NOTES}"
          fi
          gh release upload "${PREVIEW_TAG}" dist/*.fpk --clobber

      - name: Upload to version release
        if: inputs.also_upload_version_release
        env:
          RELEASE_TAG: ${{ inputs.release_tag != '' && inputs.release_tag || format('v{0}', inputs.version) }}
        run: |
          gh release upload "${RELEASE_TAG}" dist/*.fpk --clobber
