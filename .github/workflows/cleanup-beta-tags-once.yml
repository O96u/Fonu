name: One-time beta tag cleanup
on:
  push:
    branches: [v2]
    paths:
      - '.github/workflows/cleanup-beta-tags-once.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.V2_RELEASE_TOKEN || github.token }}
    steps:
      - name: Delete only obsolete beta tags and verify
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          gh release view v2.0.0-rc.01 -R "$repo" --json assets --jq '.assets | length >= 5' | grep -qx true
          gh api "repos/$repo/git/matching-refs/tags/v2" --jq '.[].ref' > refs.txt
          count=0
          while IFS= read -r ref; do
            [[ "$ref" =~ ^refs/tags/v2[.][0-9]+[.][0-9]+-(beta|bata)[.][0-9]+$ ]] || continue
            tag="${ref#refs/tags/}"
            gh api --method DELETE "repos/$repo/git/refs/tags/$tag"
            echo "Deleted $tag"
            count=$((count+1))
          done < refs.txt
          echo "Deleted $count beta tags"
          gh api "repos/$repo/git/matching-refs/tags/v2" --jq '.[].ref' > remaining.txt
          if grep -E '^refs/tags/v2[.][0-9]+[.][0-9]+-(beta|bata)[.][0-9]+$' remaining.txt; then
            echo "::error::Beta tags remain"
            exit 1
          fi
