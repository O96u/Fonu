name: Publish V2 candidate release
on:
  # A deliberate preview version change requests a new verified prerelease.
  # Ordinary audit commits only build and test; existing release tags are immutable.
  push:
    branches: [v2]
    paths:
      - '.github/workflows/v2-fpk-preview.yml'
  workflow_dispatch:
    inputs:
      run_id:
        description: V2 FPK preview run ID (optional; defaults to this commit)
        required: false
        default: ''
permissions:
  contents: write
  actions: read
concurrency:
  group: v2-prerelease
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/v2'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      INPUT_RUN_ID: ${{ inputs.run_id }}
    steps:
      - name: Resolve and wait for matching build and CI
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          run_id="$INPUT_RUN_ID"
          sha="$GITHUB_SHA"
          if [ -n "$run_id" ]; then
            [[ "$run_id" =~ ^[0-9]+$ ]]
            run="$(gh api "repos/$repo/actions/runs/$run_id")"
            jq -e '.head_branch == "v2" and .path == ".github/workflows/v2-fpk-preview.yml" and .event != "pull_request"' <<< "$run"
            sha="$(jq -r .head_sha <<< "$run")"
          fi
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          for i in $(seq 1 120); do
            if [ -z "$run_id" ]; then
              run_id="$(gh api "repos/$repo/actions/workflows/v2-fpk-preview.yml/runs?head_sha=$sha&branch=v2&per_page=20" --jq '.workflow_runs[0].id // empty')"
            fi
            ci="$(gh api "repos/$repo/actions/workflows/ci.yml/runs?head_sha=$sha&branch=v2&per_page=20" --jq '.workflow_runs | map(select(.event == "push")) | .[0].conclusion // empty')"
            build=""
            if [ -n "$run_id" ]; then
              build="$(gh api "repos/$repo/actions/runs/$run_id" --jq '.conclusion // empty')"
            fi
            if [ "$build" = success ] && [ "$ci" = success ]; then
              echo "sha=$sha" >> "$GITHUB_OUTPUT"
              echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if { [ -n "$build" ] && [ "$build" != success ]; } || { [ -n "$ci" ] && [ "$ci" != success ]; }; then
              echo "::error::Build or CI failed: build=$build CI=$ci"
              exit 1
            fi
            echo "Waiting for build and CI on $sha ($i/120)"
            sleep 15
          done
          echo "::error::Timed out waiting for matching CI/build"
          exit 1
      - name: Download and validate packages
        id: packages
        env:
          RUN_ID: ${{ steps.verify.outputs.run_id }}
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'fonu-fpk-*' --dir packages
          shopt -s nullglob
          candidates=(packages/fonu-fpk-amd64/fonu_*_amd64.fpk)
          test "${#candidates[@]}" -eq 1
          name="$(basename "${candidates[0]}")"
          version="${name#fonu_}"
          version="${version%_amd64.fpk}"
          [[ "$version" =~ ^2\.[0-9]+\.[0-9]+-(beta|rc)\.[0-9]+$ ]]
          mkdir assets
          for arch in amd64 arm64; do
            for suffix in "" _root; do
              name="fonu_${version}_${arch}${suffix}.fpk"
              test -s "packages/fonu-fpk-$arch/$name"
              cp "packages/fonu-fpk-$arch/$name" assets/
            done
          done
          (cd assets && sha256sum *.fpk > SHA256SUMS.txt)
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Publish verified prerelease
        env:
          GH_TOKEN: ${{ secrets.V2_RELEASE_TOKEN || github.token }}
          SOURCE_SHA: ${{ steps.verify.outputs.sha }}
          RUN_ID: ${{ steps.verify.outputs.run_id }}
          TAG: ${{ steps.packages.outputs.tag }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          stable="$(gh api "repos/$repo/releases/latest" --jq .tag_name)"
          [[ "$stable" != *-* ]]
          # Refuse sources with legacy tag workflows that may overwrite Latest.
          for file in github-release.yml docker-release.yml fpk-build.yml; do
            gh api "repos/$repo/contents/.github/workflows/$file?ref=$SOURCE_SHA" --jq .content | base64 -d | grep -F "'!v*-*'" >/dev/null || { echo "::error::Missing beta exclusion in $file"; exit 1; }
          done
          if gh api "repos/$repo/git/ref/tags/$TAG" > tag.json 2>/dev/null; then
            if ! jq -e --arg sha "$SOURCE_SHA" '.object.type == "commit" and .object.sha == $sha' tag.json >/dev/null; then
              existing_sha="$(jq -r .object.sha tag.json)"
              echo "::error::Prerelease tag $TAG already points to $existing_sha, not $SOURCE_SHA. Increment the preview version in v2-fpk-preview.yml; existing tags will not be overwritten."
              exit 1
            fi
          else
            gh api --method POST "repos/$repo/git/refs" -f ref="refs/tags/$TAG" -f sha="$SOURCE_SHA"
          fi
          gh api "repos/$repo/contents/docs/releases/$TAG.md?ref=$SOURCE_SHA" --jq .content | base64 -d > release-notes.md
          printf '\nSource commit: %s\nBuild run: %s\n' "$SOURCE_SHA" "$RUN_ID" >> release-notes.md
          if gh release view "$TAG" --repo "$repo" >/dev/null 2>&1; then
            gh release view "$TAG" --repo "$repo" --json isPrerelease --jq .isPrerelease | grep -qx true
            gh release edit "$TAG" --repo "$repo" --prerelease --latest=false --notes-file release-notes.md
            gh release upload "$TAG" --repo "$repo" assets/* --clobber
          else
            gh release create "$TAG" assets/* --repo "$repo" --verify-tag --prerelease --latest=false --title "Fonu ${TAG#v}" --notes-file release-notes.md
          fi
          gh release view "$TAG" --repo "$repo" --json isPrerelease,assets --jq '.isPrerelease and (.assets | length >= 5)' | grep -qx true
          test "$(gh api "repos/$repo/releases/latest" --jq .tag_name)" = "$stable"

      - name: Clean obsolete beta tags after verified RC
        if: steps.packages.outputs.tag == 'v2.0.0-rc.01'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.packages.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          gh release view "$TAG" --repo "$repo" --json isPrerelease,assets --jq '.isPrerelease and (.assets | length >= 5)' | grep -qx true
          # Only remove beta/bata Git tag refs, never stable releases or branches.
          gh api --paginate "repos/$repo/git/matching-refs/tags/v2" --jq '.[].ref' > refs.txt
          failed=0
          while IFS= read -r ref; do
            [[ "$ref" =~ ^refs/tags/v2\\.[0-9]+\\.[0-9]+-(beta|bata)\\.[0-9]+$ ]] || continue
            tag="${ref#refs/tags/}"
            if gh api "repos/$repo/releases/tags/$tag" >/dev/null 2>&1; then
              echo "::warning::Preserving $tag because it has a release; remove the beta release explicitly before deleting the tag"
              failed=1
              continue
            fi
            if gh api --method DELETE "repos/$repo/git/refs/tags/$tag"; then echo "Deleted $tag"; else failed=1; fi
          done < refs.txt
          exit "$failed"
