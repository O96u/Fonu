name: Publish V2 FPK prerelease
on:
  push:
    branches: [v2]
    paths:
      - '.github/workflows/v2-publish-preview.yml'
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful V2 FPK preview run ID
        required: true
        default: '45571678799'
permissions:
  contents: write
  actions: read
concurrency:
  group: v2-prerelease
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/v2'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ inputs.run_id || '45571678799' }}
    steps:
      - name: Verify source build and CI
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")"
          jq -e '.head_branch == "v2" and .conclusion == "success" and .path == ".github/workflows/v2-fpk-preview.yml"' <<< "$run"
          sha="$(jq -r .head_sha <<< "$run")"
          test "$sha" = 088dd4ba643183cf683a19d26ab8faaf39180d9a
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$sha&branch=v2" | jq -e '.workflow_runs | any(.name == "CI" and .conclusion == "success")'
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Download verified packages
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'fonu-fpk-*' --dir packages
          mkdir assets
          for arch in amd64 arm64; do
            for suffix in "" _root; do
              name="fonu_2.0.0-beta.3_${arch}${suffix}.fpk"
              test -s "packages/fonu-fpk-$arch/$name"
              cp "packages/fonu-fpk-$arch/$name" assets/
            done
          done
          (cd assets && sha256sum *.fpk > SHA256SUMS.txt)
      - name: Create or verify source tag
        env:
          GH_TOKEN: ${{ secrets.V2_RELEASE_TOKEN || github.token }}
          SOURCE_SHA: ${{ steps.verify.outputs.sha }}
        run: |
          set -euo pipefail
          tag="v2.0.0-beta.3"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" > tag.json 2>/dev/null; then
            jq -e --arg sha "$SOURCE_SHA" '.object.type == "commit" and .object.sha == $sha' tag.json
          else
            if ! gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$SOURCE_SHA"; then
              echo "::error::Cannot create $tag at $SOURCE_SHA. Configure V2_RELEASE_TOKEN with repository Contents and Workflows write access, or create this exact tag manually and retry."
              exit 1
            fi
          fi
      - name: Publish prerelease without changing Latest
        env:
          GH_TOKEN: ${{ secrets.V2_RELEASE_TOKEN || github.token }}
          SOURCE_SHA: ${{ steps.verify.outputs.sha }}
        run: |
          set -euo pipefail
          tag="v2.0.0-beta.3"
          gh release create "$tag" assets/* --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease --latest=false --title "Fonu 2.0 Beta 3" --notes "V2 test build. Source commit: $SOURCE_SHA. Build run: $RUN_ID. Back up existing Fonu data before installation; application ID is unchanged."
