# The verified lock was applied in f0e38097. This one-time workflow is retired.
name: Verify committed pnpm lock
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bash scripts/install-deps.sh && pnpm run build && pnpm audit --audit-level=high
        working-directory: web
