name: Apply verified npm dependency lock
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-verified-npm-lock.yml']
permissions:
  contents: write
  actions: read
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Retrieve previously verified candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 45543315369 --name npm-security-candidate-3.2 --dir "$RUNNER_TEMP/npm-candidate"
          cp "$RUNNER_TEMP/npm-candidate/package.json" "$RUNNER_TEMP/npm-candidate/package-lock.json" web/
      - name: Revalidate exact lock
        working-directory: web
        run: |
          npm ci
          npm run build
          npm audit --audit-level=moderate
      - name: Commit verified dependency files only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/package.json web/package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(web): apply verified zero-vulnerability npm lock'
          git push origin HEAD:main
