# The verified lock was applied in f0e38097. This one-time workflow is retired.
name: Verify committed npm lock
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci && npm run build && npm audit --audit-level=high
        working-directory: web
