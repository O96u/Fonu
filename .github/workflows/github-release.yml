name: GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true

concurrency:
  group: github-release-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.VERSION }}

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          if awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found = 1; next }
            found && /^## \[v/ { exit }
            found { print }
          ' CHANGELOG.md > release-body.md && [ -s release-body.md ]; then
            echo "use_changelog=true" >> "$GITHUB_OUTPUT"
          else
            echo "use_changelog=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: ${{ env.VERSION }}
          body_path: ${{ steps.notes.outputs.use_changelog == 'true' && 'release-body.md' || '' }}
          generate_release_notes: ${{ steps.notes.outputs.use_changelog != 'true' }}
          draft: false
          prerelease: false

  build-fpk:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.VERSION }}

      - name: Resolve semver
        id: semver
        run: echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install fnpack
        env:
          FNPACK_DOWNLOAD_URL: ${{ secrets.FNPACK_DOWNLOAD_URL }}
        run: |
          set -euo pipefail
          URL="${FNPACK_DOWNLOAD_URL:-https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64}"
          echo "Downloading fnpack from ${URL}"
          curl -fsSL -o /usr/local/bin/fnpack "${URL}"
          chmod +x /usr/local/bin/fnpack
          fnpack --help >/dev/null || true

      - name: Build FPK
        run: |
          chmod +x packaging/fonu-fpk/scripts/build-fpk.sh packaging/fonu-fpk/cmd/*
          packaging/fonu-fpk/scripts/build-fpk.sh "${{ matrix.arch }}" "${{ steps.semver.outputs.version }}"

      - name: Upload FPK to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${VERSION}" \
            "packaging/dist/fonu_${{ steps.semver.outputs.version }}_${{ matrix.arch }}.fpk" \
            --clobber
