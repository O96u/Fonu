name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag (e.g. v2.0.1-beta.1, v2.0.1-rc.01, v2.0.1)'
        required: true
        type: string
      publish:
        description: 'Publish Release (unchecked = test and build FPK artifacts only)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  setup:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      ref: ${{ steps.version.outputs.ref }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      publish: ${{ steps.version.outputs.publish }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Validate release tag
        id: version
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          publish=true
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            tag="$INPUT_TAG"
            publish="$INPUT_PUBLISH"
            [[ "$GITHUB_REF" == refs/heads/v2 ]] || { echo 'Select v2 as the source branch'; exit 1; }
          fi
          if [[ "$tag" =~ ^v[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
            prerelease=false
          elif [[ "$tag" =~ ^v[0-9]+[.][0-9]+[.][0-9]+-(beta|rc)[.][0-9]+$ ]]; then
            prerelease=true
          else
            echo "::error::Unsupported release tag: $tag (use vX.Y.Z, vX.Y.Z-beta.N or vX.Y.Z-rc.N)"
            exit 1
          fi
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
      - name: Check release tag availability
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists'; exit 1
          fi
          if existing=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha 2>/dev/null); then
            if [[ "$existing" != "$GITHUB_SHA" ]]; then
              # Annotated tags are resolved by git in the publish job.
              if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
                echo 'Existing tag does not match the selected commit'; exit 1
              fi
            fi
          fi
  test:
    needs: setup
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate FPK lifecycle shell scripts
        run: |
          bash -n packaging/fonu-fpk/scripts/build-fpk.sh
          for f in packaging/fonu-fpk/cmd/*; do bash -n "$f"; done
      - run: bash scripts/install-deps.sh
        working-directory: web
      - name: Test FPK lifecycle callbacks
        run: bash packaging/fonu-fpk/scripts/test-lifecycle.sh
      - name: Audit pnpm dependency vulnerabilities
        working-directory: web
        run: pnpm audit --audit-level=high
      - name: Test proxy service visual grouping and order
        run: node --test scripts/proxy-services.test.mjs
        working-directory: web
      - name: Test current and legacy live access log parsing
        working-directory: web
        run: node --experimental-strip-types --test scripts/live-access-log.test.mjs
      - run: pnpm run build
        working-directory: web
      - name: Install isolated browser test runner
        run: |
          npm install --prefix "$RUNNER_TEMP/fonu-ui-test" --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/fonu-ui-test/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify reverse proxy workspace in real Chromium
        working-directory: web
        env:
          FONU_UI_TEST_ROOT: ${{ runner.temp }}/fonu-ui-test
        run: node scripts/proxy-workspace.browser.mjs
      - name: Verify FRP workspace in real Chromium
        working-directory: web
        env:
          FONU_UI_TEST_ROOT: ${{ runner.temp }}/fonu-ui-test
        run: node scripts/frp-workspace.browser.mjs
      - name: Verify log workspace in real Chromium
        working-directory: web
        env:
          FONU_UI_TEST_ROOT: ${{ runner.temp }}/fonu-ui-test
        run: node scripts/log-workspace.browser.mjs
      - name: Verify settings workspace in real Chromium
        working-directory: web
        env:
          FONU_UI_TEST_ROOT: ${{ runner.temp }}/fonu-ui-test
        run: node scripts/settings-workspace.browser.mjs
      - name: Upload workspace screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proxy-workspace-ui
          path: web/ui-screenshots/
          if-no-files-found: ignore
      - run: mkdir -p cmd/fonu/web/dist && cp -a web/dist/. cmd/fonu/web/dist/
      - run: go vet ./...
      - name: Install Nginx for real runtime integration
        run: |
          sudo apt-get update
          sudo apt-get install -y nginx
          command -v nginx
      - name: Test actual Nginx startup, reload and rejection
        run: go test -v ./internal/nginx -run '^(TestApply(WithNginxIfAvailable|HTTPSWithMultipleCertificates)|TestTrustedProxyRealNginx)$' -count=1
      - run: go test ./...
      - name: Runtime resource sampling smoke soak (30 seconds)
        run: FONU_SOAK_SECONDS=30 go test -v ./internal/api -run '^TestRuntimeSamplingSoak$' -count=1
      - name: Benchmark realtime access aggregation
        run: go test ./internal/ingest -run '^$' -bench '^BenchmarkRealtimeRing$' -benchtime=1s -benchmem
      - name: Benchmark million access events
        run: go test ./internal/analytics -run '^$' -bench '^BenchmarkSeriesMillion$' -benchtime=3x -benchmem
      - name: Benchmark dashboard summary vs full (100k events over 30 days)
        run: go test ./internal/analytics -run '^$' -bench '^BenchmarkDashboardOverview30Days$' -benchtime=1x -benchmem
      - name: Benchmark analytics rollups (100k events)
        run: go test ./internal/analytics -run '^$' -bench '^BenchmarkSeriesRawVsRollup$' -benchtime=3x -benchmem
      - run: go test -race ./internal/auth ./internal/nginx ./internal/secret ./internal/scheduler ./internal/api ./internal/backup ./internal/acme ./internal/ddns ./internal/frp ./internal/notify ./internal/ingest ./internal/certexport ./internal/logstore ./internal/analytics
  security:
    needs: setup
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Prepare embedded frontend path for source analysis
        run: |
          mkdir -p cmd/fonu/web/dist
          printf 'security scan placeholder\n' > cmd/fonu/web/dist/index.html
      - name: Audit Go dependency vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
  fpk:
    needs: [setup, test, security]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.setup.outputs.version }}
      NGINX_VERSION: ""
      FNPACK_URL: ${{ vars.FNPACK_LINUX_AMD64_URL || 'https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64' }}
      FNPACK_SHA256: ${{ vars.FNPACK_LINUX_AMD64_SHA256 || '54b97fa7b70968c4d05c79840f5daeff508957d0bb2062fdb0376d00d9615c93' }}
      FNPACK_ARM64_URL: ${{ vars.FNPACK_LINUX_ARM64_URL || 'https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-arm64' }}
      FNPACK_ARM64_SHA256: ${{ vars.FNPACK_LINUX_ARM64_SHA256 || '' }}
    steps:
      - name: Validate nginx version
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$NGINX_VERSION" ]; then
            [[ "$NGINX_VERSION" =~ ^1\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid nginx_version'; exit 1; }
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.ref }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
          run_install: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install build dependencies and fnpack
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            gcc make binutils rsync curl ca-certificates jq python3 \
            libpcre3-dev libpcre2-dev zlib1g-dev libssl-dev
          mkdir -p "$RUNNER_TEMP/fnpack-bin"
          host_arch="$(uname -m)"
          if [ "$host_arch" = "x86_64" ]; then
            url="$FNPACK_URL"
            sha="$FNPACK_SHA256"
          else
            url="$FNPACK_ARM64_URL"
            sha="${FNPACK_ARM64_SHA256:-}"
          fi
          if [[ "$sha" =~ ^[0-9a-fA-F]{64}$ ]] && curl --fail --location --retry 3 "$url" -o "$RUNNER_TEMP/fnpack-bin/fnpack"; then
            echo "$sha  $RUNNER_TEMP/fnpack-bin/fnpack" | sha256sum -c -
            chmod 755 "$RUNNER_TEMP/fnpack-bin/fnpack"
          elif [ "$host_arch" != "x86_64" ]; then
            sudo apt-get install -y qemu-user-static
            curl --fail --location --retry 3 "$FNPACK_URL" -o "$RUNNER_TEMP/fnpack-bin/fnpack.amd64"
            echo "$FNPACK_SHA256  $RUNNER_TEMP/fnpack-bin/fnpack.amd64" | sha256sum -c -
            chmod 755 "$RUNNER_TEMP/fnpack-bin/fnpack.amd64"
            printf '%s\n' '#!/bin/sh' 'exec qemu-x86_64-static "$(dirname "$0")/fnpack.amd64" "$@"' > "$RUNNER_TEMP/fnpack-bin/fnpack"
            chmod 755 "$RUNNER_TEMP/fnpack-bin/fnpack"
          else
            echo "failed to download fnpack from $url" >&2
            exit 1
          fi
          "$RUNNER_TEMP/fnpack-bin/fnpack" --help
          echo "FNPACK_BIN=$RUNNER_TEMP/fnpack-bin/fnpack" >> "$GITHUB_ENV"

      - name: Compile native payload (reference nginx build flow)
        shell: bash
        env:
          BUILD_MODE: payload
        run: |
          set -euo pipefail
          rm -rf packaging/fonu-fpk/.cache packaging/dist/payload-${{ matrix.arch }}
          bash packaging/fonu-fpk/scripts/build-fpk.sh "${{ matrix.arch }}" "$VERSION"

      - name: Package verified native payload with fnpack
        env:
          BUILD_MODE: package
        shell: bash
        run: |
          set -euo pipefail
          bash -n packaging/fonu-fpk/scripts/build-fpk.sh
          chmod +x packaging/fonu-fpk/scripts/build-fpk.sh packaging/fonu-fpk/cmd/*
          packaging/fonu-fpk/scripts/build-fpk.sh "${{ matrix.arch }}" "$VERSION"
          test -s "packaging/dist/fonu_${VERSION}_${{ matrix.arch }}.fpk"
          test -s "packaging/dist/fonu_${VERSION}_${{ matrix.arch }}_root.fpk"
          ls -lh packaging/dist

      - name: Upload ${{ matrix.arch }} package
        uses: actions/upload-artifact@v4
        with:
          name: fonu-fpk-${{ matrix.arch }}
          path: |
            packaging/dist/fonu_${{ needs.setup.outputs.version }}_${{ matrix.arch }}.fpk
            packaging/dist/fonu_${{ needs.setup.outputs.version }}_${{ matrix.arch }}_root.fpk
          if-no-files-found: error
  docker:
    needs: [setup, test, security, fpk]
    if: needs.setup.outputs.prerelease == 'false' && needs.setup.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: docker-release-${{ github.ref }}-${{ matrix.arch }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
          - platform: linux/arm64
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.ref }}

      - name: Resolve version
        id: version
        env:
          REF_NAME: ${{ needs.setup.outputs.tag }}
        run: echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/fonu:${{ steps.version.outputs.version }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  docker-manifest:
    needs: [setup, docker]
    if: needs.setup.outputs.prerelease == 'false' && needs.setup.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Resolve version
        id: version
        env:
          REF_NAME: ${{ needs.setup.outputs.tag }}
        run: echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create multi-arch manifest
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/fonu
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -z "${IMAGE}" ]; then
            echo "DOCKERHUB_USERNAME secret is not set" >&2
            exit 1
          fi
          docker buildx imagetools create \
            -t "${IMAGE}:${VERSION}" \
            -t "${IMAGE}:latest" \
            "${IMAGE}:${VERSION}-amd64" \
            "${IMAGE}:${VERSION}-arm64"
  publish:
    needs: [setup, test, security, fpk, docker-manifest]
    if: ${{ always() && needs.setup.result == 'success' && needs.setup.outputs.publish == 'true' && needs.test.result == 'success' && needs.security.result == 'success' && needs.fpk.result == 'success' && (needs.setup.outputs.prerelease == 'true' || needs.docker-manifest.result == 'success') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.setup.outputs.version }}
      PRERELEASE: ${{ needs.setup.outputs.prerelease }}
      TAG: ${{ needs.setup.outputs.tag }}
      SOURCE_SHA: ${{ needs.setup.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: fonu-fpk-*
          merge-multiple: true
          path: assets
      - name: Verify release packages and publish
        shell: bash
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            for suffix in "" _root; do
              test -s "assets/fonu_${VERSION}_${arch}${suffix}.fpk"
            done
          done
          (cd assets && sha256sum *.fpk > SHA256SUMS.txt)
          tag="$TAG"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            git fetch origin "refs/tags/$tag:refs/tags/$tag"
            [[ "$(git rev-list -n 1 "$tag")" == "$SOURCE_SHA" ]] || { echo 'Tag points to another commit'; exit 1; }
          else
            [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]] || exit 1
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$SOURCE_SHA"
          fi
          flags=(--verify-tag --title "Fonu $VERSION")
          if [[ "$PRERELEASE" == true ]]; then
            flags+=(--prerelease --latest=false)
          else
            flags+=(--latest)
          fi
          if [[ -s "docs/releases/$tag.md" ]]; then
            flags+=(--notes-file "docs/releases/$tag.md")
          else
            awk -v heading="## [$tag]" 'index($0, heading)==1 {found=1; next} found && /^## [[]/ {exit} found {print}' CHANGELOG.md > release-notes.md
            if [[ -s release-notes.md ]]; then flags+=(--notes-file release-notes.md); else flags+=(--generate-notes); fi
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists; refusing to overwrite its assets"
            exit 1
          fi
          gh release create "$tag" assets/* "${flags[@]}"
