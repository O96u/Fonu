name: Verify npm security upgrade
on:
  push:
    branches: [main]
    paths: ['.github/workflows/npm-security-upgrade.yml', 'web/src/views/ProxyView.vue', 'web/src/views/SettingsView.vue']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        vue-tsc: ['3.1', '3.2', '3.3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve security updates
        working-directory: web
        run: |
          npm ci
          npm install --save-dev 'vue-tsc@${{ matrix.vue-tsc }}'
          npm audit fix --package-lock-only || true
          npm ci
          npm run build
      - name: Audit candidate
        working-directory: web
        run: npm audit --audit-level=moderate
      - name: Upload candidate dependency files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-security-candidate-${{ matrix.vue-tsc }}
          path: |
            web/package.json
            web/package-lock.json
          if-no-files-found: error
