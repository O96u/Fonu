name: Verify pnpm security upgrade
on:
  push:
    branches: [main]
    paths: ['.github/workflows/npm-security-upgrade.yml', 'web/src/components/MiniTrafficChart.vue', 'web/package.json', 'web/pnpm-lock.yaml', 'web/package-lock.json']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        vue-tsc: ['3.2']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve security updates
        working-directory: web
        run: |
          bash scripts/install-deps.sh
          pnpm add -D -E 'vue-tsc@${{ matrix.vue-tsc }}'
          pnpm audit --fix || true
          bash scripts/install-deps.sh
          pnpm run build
      - name: Audit candidate
        working-directory: web
        run: pnpm audit --audit-level=moderate
      - name: Upload candidate dependency files
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-security-candidate-${{ matrix.vue-tsc }}
          path: |
            web/package.json
            web/pnpm-lock.yaml
          if-no-files-found: error
