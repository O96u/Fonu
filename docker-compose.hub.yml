services:
  fonu:
    image: ${DOCKERHUB_USERNAME}/fonu:${FONU_VERSION:-latest}
    container_name: fonu
    restart: unless-stopped
    ports:
      - "6893:6893"
      - "18080:80"
      - "9443:443"
    volumes:
      - fonu-data:/data
    environment:
      FONU_DATA_DIR: /data
      FONU_LISTEN: :6893
      FONU_SESSION_SECRET: ${FONU_SESSION_SECRET:-change-me-in-production}

volumes:
  fonu-data:
